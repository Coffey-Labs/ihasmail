{% extends "base.html" %}
{% block content %}
<h1>Calendar (JMAP & CalDAV)</h1>
<p class="muted">Listing upcoming events via JMAP. CalDAV endpoints available for DAV clients.</p>
<table>
  <tr><th>When</th><th>Summary</th><th>Where</th></tr>
  {% for e in events %}
  <tr>
    <td class="nowrap">{{ e.start }} – {{ e.end }}</td>
    <td>{{ e.title }}</td>
    <td>{{ e.loc or "" }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
