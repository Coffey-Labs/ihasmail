{% extends "base.html" %}
{% block content %}
<h1>Contacts (Directory via JMAP)</h1>
<div class="toolbar">
  <form>
    <input name="q" value="{{ q or '' }}" placeholder="Search name/email…">
  </form>
</div>
<table>
  <tr><th>Name</th><th>Email</th><th>Org</th></tr>
  {% for c in contacts %}
  <tr>
    <td>{{ c.name }}</td>
    <td>{{ c.email }}</td>
    <td>{{ c.org or "" }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
